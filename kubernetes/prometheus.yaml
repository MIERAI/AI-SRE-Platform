# Prometheus —— 刻意写成单 Pod 的精简版，不用 kube-prometheus-stack。
#
# 理由是实测约束（docs/phase6-why.md §1）：宿主机 24 GiB 且已 swap 5.8 GiB。
# kube-prometheus-stack 会拉起 Operator + Alertmanager + node-exporter +
# kube-state-metrics + Grafana 一整套，约 1.5–2 GiB。
# 而本阶段要验证的是**「防御是否还有效」这条链路能不能跑通** ——
# 抓取 → 规则求值 → 告警触发。单 Pod 全都能验。
#
# 保留期 2h：本地实验不需要长期存储，省内存与磁盘。

apiVersion: v1
kind: ConfigMap
metadata: {name: prometheus-config}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/rules/*.yaml

    scrape_configs:
      # sre-agent 跑在【宿主机】上，不在集群里 —— 模型不进 Pod 的直接后果
      # （24 GiB 单机放不下 14B+judge+集群，见 phase6-why §1）。
      # 这也符合生产实际：LLM 通常是独立推理服务。
      - job_name: sre-agent
        static_configs:
          - targets: ['host.docker.internal:8080']
        metrics_path: /metrics

      - job_name: prometheus
        static_configs:
          - targets: ['localhost:9090']

---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus, labels: {app: prometheus}}
spec:
  replicas: 1
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:v3.7.3
        args:
          - --config.file=/etc/prometheus/prometheus.yml
          - --storage.tsdb.path=/prometheus
          - --storage.tsdb.retention.time=2h
          - --web.enable-lifecycle          # 允许 POST /-/reload 热加载规则
        ports: [{name: web, containerPort: 9090}]
        volumeMounts:
          - {name: config, mountPath: /etc/prometheus/prometheus.yml, subPath: prometheus.yml}
          - {name: rules,  mountPath: /etc/prometheus/rules}
          - {name: data,   mountPath: /prometheus}
        resources:
          requests: {memory: "192Mi", cpu: "100m"}
          limits:   {memory: "512Mi", cpu: "1"}
        readinessProbe:
          httpGet: {path: /-/ready, port: web}
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /-/healthy, port: web}
          periodSeconds: 30
      volumes:
        - {name: config, configMap: {name: prometheus-config}}
        - {name: rules,  configMap: {name: prometheus-rules}}
        - {name: data,   emptyDir: {}}

---
apiVersion: v1
kind: Service
metadata: {name: prometheus, labels: {app: prometheus}}
spec:
  type: NodePort
  selector: {app: prometheus}
  ports:
    - {name: web, port: 9090, targetPort: web, nodePort: 30090}

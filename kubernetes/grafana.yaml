# Grafana —— 单 Pod，datasource 与 dashboard 全部走 provisioning。
#
# 为什么用 provisioning 而不是进 UI 点：**面板必须能进版本库**。
# 手点出来的 dashboard 只存在于 Grafana 的数据库里，换台机器就没了，
# 也没法 review「为什么这个面板要这么设计」——
# 而本项目的面板描述里恰恰写满了「这个指标不能单独解读」这类结论。

apiVersion: v1
kind: ConfigMap
metadata: {name: grafana-provisioning}
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prom            # 必须与 dashboard.json 里的 datasource.uid 一致
        access: proxy
        url: http://prometheus:9090
        isDefault: true
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: ai-sre
        type: file
        options:
          path: /var/lib/grafana/dashboards
        allowUiUpdates: false     # UI 改不动 —— 改面板要改仓库里的 JSON

---
apiVersion: apps/v1
kind: Deployment
metadata: {name: grafana, labels: {app: grafana}}
spec:
  replicas: 1
  selector: {matchLabels: {app: grafana}}
  template:
    metadata: {labels: {app: grafana}}
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:12.3.1
        ports: [{name: web, containerPort: 3000}]
        env:
          # 本地实验集群，关掉登录省事；**任何对外暴露的部署都不能这么做**
          - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
          - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: "Admin"}
          - {name: GF_AUTH_DISABLE_LOGIN_FORM, value: "true"}
          - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
          - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
        volumeMounts:
          - {name: prov-ds,    mountPath: /etc/grafana/provisioning/datasources}
          - {name: prov-dash,  mountPath: /etc/grafana/provisioning/dashboards}
          - {name: dashboards, mountPath: /var/lib/grafana/dashboards}
        resources:
          requests: {memory: "128Mi", cpu: "50m"}
          limits:   {memory: "384Mi", cpu: "1"}
        readinessProbe:
          httpGet: {path: /api/health, port: web}
          periodSeconds: 10
          failureThreshold: 12
      volumes:
        - name: prov-ds
          configMap: {name: grafana-provisioning, items: [{key: datasource.yaml, path: datasource.yaml}]}
        - name: prov-dash
          configMap: {name: grafana-provisioning, items: [{key: dashboards.yaml, path: dashboards.yaml}]}
        - name: dashboards
          configMap: {name: grafana-dashboards}

---
apiVersion: v1
kind: Service
metadata: {name: grafana, labels: {app: grafana}}
spec:
  type: NodePort
  selector: {app: grafana}
  ports:
    - {name: web, port: 3000, targetPort: web, nodePort: 30030}

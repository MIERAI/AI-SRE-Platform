# 手机1 上的 Grafana。
#
# ⚑ 三处偏离默认值，都是**因为跑在手机上**：
#   1. unified_alerting 关掉 —— 告警由 Prometheus 负责，Grafana 再跑一套
#      规则求值器纯属重复，在一台要撑两个月的手机上是白烧 CPU 和电。
#   2. reporting / check_for_updates 关掉 —— 默认会定期外连 grafana.com。
#      手机在家用宽带上，这既无必要也是多余的唤醒。
#   3. log level = warn —— 默认 info 会持续写盘。闪存写入是手机的消耗品。
#
# ⚑ admin 密码由部署脚本随机生成后写入，**不入版本库**。
#   绑 0.0.0.0 是为了 tailnet 内可访问，代价是家里 WiFi 上任何设备都能连到
#   :3000。路由器没有端口转发，公网仍进不来（见 docs/phase6-why.md）。

[paths]
data = /data/data/com.termux/files/home/grafana/data
logs = /data/data/com.termux/files/home/grafana/logs
plugins = /data/data/com.termux/files/home/grafana/plugins
provisioning = /data/data/com.termux/files/home/grafana/provisioning

[server]
http_addr = 0.0.0.0
http_port = 3000
# ⚑ root_url 必须与【浏览器地址栏里实际是什么】一致，前端会拿它拼绝对地址
#   （登录跳转、Grafana Live 的 websocket）。对不上时症状很迷惑：
#   登录页打得开，一提交就跳到一个打不开的地址。
#
#   这里保持 localhost 而不是填 Tailscale IP，是因为访问方式统一走 SSH 隧道
#   （Mac 和手机2 都是本地 3000）—— 实测手机2 的浏览器打不开 100.64/10 段地址，
#   但 127.0.0.1 没问题，而 Termux 里 curl 两个都通。既然查不清是哪层拦的，
#   就走已被证明可用的路径。改成直连 IP 访问时，这两行要跟着改。
domain = localhost
root_url = http://localhost:3000/

[users]
allow_sign_up = false
# 手机上默认落到移动版看板，而不是 8 面板的桌面版。
home_dashboard_uid = phone1m

[auth]
# ⚑ 默认「7 天不活动登出 / 30 天强制过期」。人要离开两个月，
#   回来第一件事就是被踢到登录页、还得现找那串 14 位随机密码。
#   延到 90 天覆盖整个行程。代价：会话 cookie 泄露的窗口更长 ——
#   在只有 tailnet 能访问的前提下，这个代价可以接受。
login_maximum_inactive_lifetime_duration = 90d
login_maximum_lifetime_duration = 90d

[analytics]
reporting_enabled = false
check_for_updates = false

[unified_alerting]
enabled = false

[log]
mode = file
level = warn

[dashboards]
min_refresh_interval = 15s

# aria2 —— 手机1 的远程下载机。
#
# ⚑ **save-session / input-file 这一对在这台设备上不是可选项。**
#   Android 会定期把 Termux 整个杀掉（实测一夜四次）。没有会话持久化的话，
#   每次被杀都会丢掉整个下载队列 —— 已下的分片还在磁盘上，但 aria2 不知道
#   它们属于哪个任务，等于从头再来。watchdog 会把进程拉回来，
#   于是表现成「下载永远在重新开始」，而所有存活指标都是绿的。
#
# ⚑ rpc-listen-all=false：RPC 能指定任意下载路径，等于任意写文件。
#   和 File Browser 一样绑本地，走 SSH 隧道访问。
#   （Grafana 绑 0.0.0.0 是因为它只泄露温度电量，这里不一样。）

# ── RPC ──────────────────────────────────────────────
enable-rpc=true
rpc-listen-port=6800
rpc-listen-all=false
rpc-allow-origin-all=true
# rpc-secret 由部署脚本随机生成后追加，不写在版本库里

# ── 会话持久化（见上方说明）──────────────────────────
input-file=/data/data/com.termux/files/home/.aria2/session
save-session=/data/data/com.termux/files/home/.aria2/session
save-session-interval=30
force-save=true
auto-save-interval=30

# ── 存放位置 ─────────────────────────────────────────
dir=/data/data/com.termux/files/home/nas/downloads
# ⚑ file-allocation 必须是 none。这块盘是 Android 的 FUSE 挂载，
#   falloc/prealloc 在上面会失败或极慢，表现为「大文件一开始就卡住」。
file-allocation=none
disk-cache=32M

# ── HTTP 多线程分片（Transmission 完全没有的能力）────
continue=true
max-connection-per-server=16
split=16
min-split-size=1M
max-concurrent-downloads=5
max-tries=5
retry-wait=10
timeout=60
connect-timeout=30

# ── BT ───────────────────────────────────────────────
bt-enable-lpd=true
bt-max-peers=64
follow-torrent=true
# ⚑ 下完即停，不无限做种。这是手机：电和流量都是有限的，
#   而且长期做种会让它一直保持唤醒，加大被系统回收的概率。
seed-time=0
bt-remove-unselected-file=true
# DHT 的节点表也要持久化，否则每次重启都要重新引导
dht-file-path=/data/data/com.termux/files/home/.aria2/dht.dat
enable-dht=true

# ── 日志 ─────────────────────────────────────────────
log=/data/data/com.termux/files/home/.aria2/aria2.log
log-level=warn
# ⚑ 闪存是手机的消耗品，info 级别会持续写盘
console-log-level=warn
summary-interval=0

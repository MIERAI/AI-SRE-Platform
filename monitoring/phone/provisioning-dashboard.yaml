# 面板从文件加载。改面板 = 改仓库里的 phone-dashboard.json 再重启，
# 而不是在 UI 上拖 —— UI 上的改动会被下一次 provisioning 覆盖，
# 这是刻意的：让「线上长什么样」永远等于「版本库里写了什么」。

apiVersion: 1

providers:
  - name: phone
    type: file
    allowUiUpdates: false
    options:
      path: /data/data/com.termux/files/home/grafana/dashboards
      foldersFromFilesStructure: false
